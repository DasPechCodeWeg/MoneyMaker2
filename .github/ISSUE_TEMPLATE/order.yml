name: Order
description: Order an upgrade audit or an unblock PR. Nothing is binding until the account holder accepts in this issue. You pay only after delivery.
title: "[order] "
labels: [order]
body:
  - type: dropdown
    id: service
    attributes:
      label: Service
      options:
        - Upgrade audit (USD 29, pay after delivery)
        - Unblock PR (USD 149, pay after delivery)
    validations: {required: true}
  - type: input
    id: repo
    attributes:
      label: Public repository URL (optional)
      description: For an Unblock PR, the repo we should open the PR against. It must be yours.
  - type: textarea
    id: requirements
    attributes:
      label: Requirements or lock file contents
      description: Paste it, or point to the file in the repo above. Never paste secrets or private index URLs with tokens.
      render: text
  - type: checkboxes
    id: terms
    attributes:
      label: Terms
      options:
        - label: I understand that one person delivers this using an AI coding agent, that nothing is binding until they accept in this issue, and that I pay only after delivery and only if I am satisfied.
          required: true
